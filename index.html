<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#EBDFC2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우타노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>우타노트 · 일본어 가사 공부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --h:30;
  --bg:#EBDFC2; --ink:#33241A; --ink2:#6E5539;
  --surface:rgba(241,228,198,.98); --surface2:rgba(90,60,30,.09);
  --line:rgba(70,45,20,.24); --accent:#8E3B22;
  --edge:transparent;
  --tex:none;
  --ja:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --ko:"Gowun Batang","AppleMyungjo","Batang","Noto Serif KR",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --ink:#F2F2F2; --ink2:#A6A6A6;
    --surface:#141414; --surface2:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.16); --accent:#E3A57A;
    --edge:transparent; --tex:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --ink:#F2F2F2; --ink2:#A6A6A6;
  --surface:#141414; --surface2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.16); --accent:#E3A57A;
  --edge:transparent; --tex:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  height:100%;margin:0;background:var(--tex),var(--bg);color:var(--ink);
  font-family:var(--ko);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  -webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s;
}
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 85% 75% at 50% 45%,transparent 55%,var(--edge) 100%);
  box-shadow:inset 0 0 120px var(--edge);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,.ln:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}

/* header */
header{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,4vw,32px);max-width:860px;width:100%;margin:0 auto;border-bottom:1px solid var(--line);flex-wrap:wrap;row-gap:12px}
.info{display:flex;align-items:center;gap:14px;min-width:0;flex:1;text-align:left;padding:4px;margin:-4px;border-radius:14px}
.info:hover{background:var(--surface2)}
.meta{min-width:0;flex:1;display:flex;align-items:baseline;gap:10px}
.meta .t{min-width:0;font-family:var(--ja);font-size:clamp(24px,6vw,30px);font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .a{flex:none;max-width:45%;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon:hover{background:var(--surface2)}
.icon svg{width:22px;height:22px}
.icon[aria-pressed="true"]{color:var(--accent);background:var(--surface2)}

/* lyrics */
main{overflow-y:auto;overscroll-behavior:contain}
.lyrics{max-width:860px;margin:0 auto;padding:12px clamp(16px,4vw,32px) 80px}
.ln{padding:10px 0;margin:0 0 10px}
.ln p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.editing .ln p,.ln p.wrap{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;text-wrap:balance}
.ja{font-family:var(--ja);font-weight:700;font-size:clamp(22px,5.6vw,34px);line-height:1.35;letter-spacing:.01em}
.pr{font-size:clamp(15px,3.6vw,19px);color:var(--accent);font-weight:500;margin-top:6px!important;line-height:1.5}
.ko{font-size:clamp(15px,3.6vw,18px);color:var(--ink2);line-height:1.55;margin-top:2px!important}
.gap{height:34px}
body.no-pr .pr,body.no-ko .ko{display:none}
.ln [contenteditable="true"]{outline:1px dashed var(--line);border-radius:6px;padding:0 4px;cursor:text}
.empty{text-align:center;color:var(--ink2);padding-top:10vh}
.empty p{margin:0 0 16px}

/* toggles */
.tools{display:flex;gap:6px;align-items:center;width:100%}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.chip.ic{display:inline-grid;place-items:center;padding:6px 11px}
.chip.ic svg{width:17px;height:17px;display:block}
#themeBtn{margin-left:auto}
.chip{font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* dialogs */
dialog{border:1px solid var(--line);padding:0;background:var(--tex),var(--surface);color:var(--ink);border-radius:6px;width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px);box-shadow:0 30px 80px rgba(30,15,5,.45)}
dialog::backdrop{background:rgba(30,18,8,.45)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 40px);overflow:auto}
.dlg h2{margin:0;font-size:20px}
.dlg .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.song{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;width:100%;text-align:left}
.song:hover,.song.cur{background:var(--surface2)}
.song b{display:block;font-family:var(--ja);font-weight:700}
.song small{color:var(--ink2)}
.song-wrap{display:flex;align-items:center}
.artist-hd{margin:14px 0 4px;padding:6px 12px;border-radius:8px;background:var(--ink);font-size:13px;font-weight:700;color:var(--bg);font-family:var(--ja)}
#songList .artist-hd:first-child{margin-top:4px}
.del{color:var(--ink2);font-size:13px;padding:8px}
.del:hover{color:#d33}
label{font-size:13px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
input,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{font-family:var(--ja);min-height:220px;resize:vertical;line-height:1.6;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{background:var(--ink);color:var(--bg);font-weight:600;padding:12px 18px;border-radius:12px}
.primary:disabled{opacity:.5;cursor:wait}
.ghost{padding:12px 14px;border-radius:12px;color:var(--ink2)}
.hint{font-size:13px;color:var(--ink2);margin:0;line-height:1.55}
.status{font-size:13px;margin:0;min-height:1.2em;color:var(--accent)}
.status.err{color:#d33}
@media (max-width:520px){
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"></div>

<header>
  <button class="info" id="infoBtn" title="제목·가수 수정" aria-label="노래 제목과 가수 수정">
    <span class="meta"><span class="t" id="title" lang="ja"></span><span class="a" id="artist"></span></span>
  </button>
  <button class="icon" id="libBtn" title="내 노래 목록" aria-label="내 노래 목록">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h10"/><circle cx="18" cy="16" r="2.2"/><path d="M20.2 16V9"/></svg>
  </button>
  <div class="tools">
    <button class="chip" id="prBtn" aria-pressed="true">발음</button>
    <button class="chip" id="koBtn" aria-pressed="true">해석</button>
    <span class="sep" aria-hidden="true"></span>
    <button class="chip ic" id="editBtn" aria-pressed="false" title="가사 직접 고치기" aria-label="가사 직접 고치기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
    </button>
    <button class="chip ic" id="themeBtn" aria-label="다크 모드로 전환" title="다크 모드 전환"></button>
  </div>
</header>

<main id="main"><p class="hint" id="syncNote" hidden style="text-align:center;padding:8px 16px"></p><div class="lyrics" id="lyrics"></div></main>


<dialog id="libDlg">
  <div class="dlg">
    <div class="row"><h2>내 노래</h2><button class="primary" id="impBtn">불러오기</button></div>
    <input type="file" id="fImp" accept=".json,application/json" multiple hidden>
    <p class="status" id="bakMsg" role="status"></p>
    <input type="search" id="songSearch" placeholder="제목·가수 검색 (한글·영문 발음도 돼요)" aria-label="노래 검색" autocomplete="off" style="width:100%;margin:2px 0 4px">
    <div id="songList"></div>
    <div class="row"><span></span><button class="ghost" data-close>닫기</button></div>
  </div>
</dialog>

<dialog id="addDlg">
  <div class="dlg">
    <h2>새 노래 추가</h2>
    <div class="two">
      <label>노래 제목<input id="fTitle" lang="ja" placeholder="예: 夜明けの駅"></label>
      <label>가수<input id="fArtist" placeholder="예: 좋아하는 가수"></label>
    </div>
    <label>일본어 가사<textarea id="fLyrics" lang="ja" placeholder="일본어 가사, 또는 일본어·발음·해석 세 줄씩 정리된 가사를 붙여넣으세요."></textarea></label>
    <p class="hint">일본어·발음·해석이 한 묶음씩 정리된 가사를 붙여넣으면 그대로 가져옵니다. 자동 생성은 Claude 웹 버전에서만 돼요. 저장 후에는 연필 버튼으로 고칠 수 있어요.</p>
    <p class="status" id="status" role="status"></p>
    <div class="row">
      <button class="ghost" data-close>취소</button>
      <button class="primary" id="makeBtn">노래 추가</button>
    </div>
  </div>
</dialog>

<dialog id="infoDlg">
  <div class="dlg">
    <h2>노래 정보 수정</h2>
    <div class="two">
      <label>노래 제목<input id="eTitle" lang="ja"></label>
      <label>가수<input id="eArtist"></label>
    </div>
    <p class="status err" id="infoMsg" role="status"></p>
    <div class="row">
      <button class="ghost" data-close>취소</button>
      <button class="primary" id="saveInfo">저장</button>
    </div>
  </div>
</dialog>

<script>
(() => {
const KEY = 'utanote:v1';
const $ = id => document.getElementById(id);

let state;
try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { state = null; }
if (!state || !Array.isArray(state.songs)) state = { songs:[], cur:null, prefs:{pr:true, ko:true} };
if (!state.prefs) state.prefs = {pr:true, ko:true};
if (!Array.isArray(state.removed)) state.removed = [];
state.songs.forEach(s => { delete s.pic; });
state.songs = state.songs.filter(s => s.id !== 'demo');
if (!state.songs.some(s => s.id === state.cur)) state.cur = state.songs[0] ? state.songs[0].id : null;
let remote = null, synced = {}, syncedPrefs = '';
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (remote) { pushSongs(); pushPrefs(); }
};
function pushPrefs() {
  const j = JSON.stringify(state.prefs);
  if (j === syncedPrefs) return;
  syncedPrefs = j;
  remote.doc('prefs').set({prefs: state.prefs}).catch(e => { syncedPrefs = ''; syncMsg(e); });
}
function applyRemotePrefs(p) {
  if (!p || typeof p !== 'object') return false;
  const j = JSON.stringify(p);
  syncedPrefs = j;
  if (j === JSON.stringify(state.prefs)) return false;
  state.prefs = {pr: true, ko: true, ...p};
  return true;
}
function pushSongs() {
  const seen = new Set();
  for (const s of state.songs) {
    seen.add(s.id);
    const j = JSON.stringify(s);
    if (synced[s.id] === j) continue;
    synced[s.id] = j;
    remote.doc(s.id).set({song: s}).catch(e => { delete synced[s.id]; syncMsg(e); });
  }
  for (const id of Object.keys(synced)) {
    if (seen.has(id)) continue;
    delete synced[id];
    remote.doc(id).delete().catch(syncMsg);
  }
}
function syncMsg(e) {
  const el = $('syncNote'); if (!el) return;
  el.textContent = e && e.code === 'quota_exceeded' ? '저장 공간이 가득 찼어요. 사진이나 노래를 일부 지워 주세요.' : '동기화에 실패했어요. 이 기기에는 저장됐고, 다시 열면 재시도합니다.';
  el.hidden = false;
}

let editing = false;
const song = () => state.songs.find(s => s.id === state.cur) || state.songs[0];

function render() {
  const s = song();
  if (!s) {
    document.documentElement.style.setProperty('--h', 30);
    $('title').textContent = '아직 노래가 없어요';
    $('artist').textContent = '';
    $('lyrics').innerHTML = '<div class="empty"><p>가사 파일을 불러와 주세요.</p><button class="primary" id="emptyAdd">불러오기</button></div>';
    $('emptyAdd').onclick = () => $('fImp').click();
    return;
  }
  document.documentElement.style.setProperty('--h', s.hue);
  $('title').textContent = s.title || '제목 없음';
  $('artist').textContent = s.artist || '';
  const box = $('lyrics'); box.textContent = '';
  if (!s.lines.length) { box.innerHTML = '<p class="empty">가사가 없습니다. 목록에서 새 노래를 추가해 보세요.</p>'; return; }
  s.lines.forEach((l, i) => {
    if (l.gap) { const g = document.createElement('div'); g.className='gap'; box.appendChild(g); return; }
    const d = document.createElement('div');
    d.className = 'ln'; d.dataset.i = i;
    for (const [k, cls, lang] of [['ja','ja','ja'],['pr','pr','ko'],['ko','ko','ko']]) {
      const p = document.createElement('p'); p.className = cls; p.lang = lang; p.dataset.k = k;
      p.textContent = l[k] || ''; if (editing) p.contentEditable = 'true';
      d.appendChild(p);
    }
    box.appendChild(d);
  });
  fitAll();
}

function applyPrefs() {
  const p = state.prefs;
  document.body.classList.toggle('no-pr', !p.pr);
  document.body.classList.toggle('no-ko', !p.ko);
  $('prBtn').setAttribute('aria-pressed', p.pr);
  $('koBtn').setAttribute('aria-pressed', p.ko);
  fitAll();
}

/* interactions */
$('lyrics').addEventListener('focusout', e => {
  const p = e.target; if (!editing || !p.dataset?.k) return;
  const i = +p.closest('.ln').dataset.i;
  const s = song(), v = p.textContent.trim();
  if (s.lines[i][p.dataset.k] !== v) { s.lines[i][p.dataset.k] = v; s.edited = true; }
  save();
});
for (const [btn, k] of [['prBtn','pr'],['koBtn','ko']]) {
  $(btn).onclick = () => { state.prefs[k] = !state.prefs[k]; applyPrefs(); save(); };
}
$('editBtn').onclick = () => {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  $('editBtn').setAttribute('aria-pressed', editing);
  render();
};

/* library */
/* search key: width/case folded, hiragana treated as katakana, spaces and dots ignored */
/* romaji long vowels (ou/oo/uu) fold to one letter so shounen = shonen; Korean long-vowel dash and apostrophes are ignored */
const fold = t => t.normalize('NFKC').toLowerCase().replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/[\s・.·\-ー'’!?~～]/g, '').replace(/o[ou]/g, 'o').replace(/uu/g, 'u');
$('songSearch').addEventListener('input', () => renderList());
function renderList() {
  const box = $('songList'); box.textContent = '';
  const col = new Intl.Collator('ja', {numeric: true, sensitivity: 'base'});
  const groups = new Map();
  const q = fold($('songSearch').value);
  const list = q ? state.songs.filter(s => fold((s.title || '') + ' ' + (s.artist || '') + ' ' + (s.kw || '')).includes(q)) : state.songs;
  if (!list.length) { const p = document.createElement('p'); p.className = 'hint'; p.style.padding = '12px'; p.textContent = '찾는 노래가 없어요.'; box.appendChild(p); return; }
  list.forEach(s => { const a = (s.artist || '').trim() || '가수 미입력'; if (!groups.has(a)) groups.set(a, []); groups.get(a).push(s); });
  [...groups.keys()].sort(col.compare).forEach(a => {
    const hd = document.createElement('div'); hd.className = 'artist-hd'; hd.lang = 'ja'; hd.textContent = a; box.appendChild(hd);
    groups.get(a).sort((x, y) => col.compare(x.title || '', y.title || '')).forEach(s => {
    const w = document.createElement('div'); w.className = 'song-wrap';
    const b = document.createElement('button'); b.className = 'song' + (s.id === state.cur ? ' cur' : '');
    b.innerHTML = `<span><b lang="ja"></b></span>`;
    b.querySelector('b').textContent = s.title || '제목 없음';
    b.onclick = () => { state.cur = s.id; save(); render(); $('main').scrollTop = 0; $('libDlg').close(); };
    w.append(b); box.appendChild(w);
    });
  });
}
$('libBtn').onclick = () => { $('songSearch').value = ''; renderList(); $('bakMsg').textContent = ''; $('libDlg').showModal(); };

/* backup */
function bakMsg(t, err) { $('bakMsg').textContent = t; $('bakMsg').classList.toggle('err', !!err); }
const byNewest = (a, b) => (parseInt(b.id.slice(1)) || 0) - (parseInt(a.id.slice(1)) || 0);
const isSong = s => s && typeof s.id === 'string' && Array.isArray(s.lines);
function songFileName(s) {
  const t = (s.title || 'song').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
  return `utanote-${t}.json`;
}
async function saveFile(name, data, okMsg) {
  let dl = null;
  if (window.claude && window.claude.use) dl = await claude.use('downloads').catch(() => null);
  if (dl) {
    try { await dl.save({filename: name, data}); bakMsg(okMsg); }
    catch (e) { bakMsg('저장이 취소됐어요.', true); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  bakMsg(okMsg);
}
/* accepts a full backup {songs:[…]} or a single song file {song:{…}} */
function songsFromFile(j) {
  if (!j || typeof j !== 'object') return null;
  if (Array.isArray(j.songs)) return j.songs.filter(isSong);
  if (isSong(j.song)) return [j.song];
  if (isSong(j)) return [j];
  return null;
}
function mergeSongs(incoming, overwrite) {
  const map = new Map(state.songs.map(s => [s.id, s]));
  let added = 0;
  incoming.forEach(s => { if (overwrite || !map.has(s.id)) { if (!map.has(s.id)) added++; map.set(s.id, s); } });
  state.songs = [...map.values()].sort(byNewest);
  if (!state.cur && state.songs[0]) state.cur = state.songs[0].id;
  return added;
}
$('impBtn').onclick = () => $('fImp').click();
$('fImp').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  let n = 0, bad = 0, prefs = null;
  for (const f of files) {
    try {
      const j = JSON.parse(await f.text());
      const songs = songsFromFile(j); if (!songs) throw 0;
      state.removed = state.removed.filter(id => !songs.some(s => s.id === id));
      mergeSongs(songs, true); n += songs.length;
      if (j.prefs && typeof j.prefs === 'object') prefs = j.prefs;
    } catch (err) { bad++; }
  }
  if (prefs) state.prefs = {...state.prefs, ...prefs};
  save(); applyTheme(); applyPrefs(); render(); renderList();
  if (!n) bakMsg('우타노트 노래 파일이 아니에요.', true);
  else bakMsg(`${n}곡을 불러왔어요.` + (bad ? ` (${bad}개 파일은 읽지 못했어요)` : ''), false);
};

/* bundled song files: songs/index.json lists files next to the app, so every device that opens it gets them */
const bundledIds = new Set();
async function loadBundled() {
  try {
    const r = await fetch('songs/index.json', {cache: 'no-cache'}); if (!r.ok) return;
    const idx = await r.json();
    const names = (idx && Array.isArray(idx.songs) ? idx.songs : []).filter(x => typeof x === 'string' && /^[\w.-]+\.json$/.test(x));
    const got = (await Promise.all(names.map(n => fetch('songs/' + n, {cache: 'no-cache'}).then(r => r.ok ? r.json() : null).catch(() => null))))
      .flatMap(j => songsFromFile(j) || []);
    got.forEach(s => bundledIds.add(s.id));
    const fresh = got.filter(s => !state.removed.includes(s.id));
    /* corrected bundled lyrics replace the stored copy, unless the user edited that song on this device */
    const mine = new Map(state.songs.map(s => [s.id, s]));
    const changed = fresh.filter(s => { const o = mine.get(s.id); return o && !o.edited && JSON.stringify([o.title, o.artist, o.kw, o.lines]) !== JSON.stringify([s.title, s.artist, s.kw, s.lines]); });
    if (changed.length) mergeSongs(changed, true);
    if (mergeSongs(fresh, false) || changed.length) { save(); if (!editing) render(); if ($('libDlg').open) renderList(); }
  } catch (e) {}
}
function openAdd() {
  if ($('libDlg').open) $('libDlg').close();
  $('status').textContent = ''; $('addDlg').showModal(); $('fTitle').focus();
}
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

/* song info */
$('infoBtn').onclick = () => {
  const s = song(); if (!s) return openAdd();
  $('eTitle').value = s.title || ''; $('eArtist').value = s.artist || '';
  $('infoMsg').textContent = '';
  $('infoDlg').showModal();
};
$('saveInfo').onclick = () => {
  const s = song(); if (!s) return;
  const t0 = s.title, a0 = s.artist;
  s.title = $('eTitle').value.trim() || s.title; s.artist = $('eArtist').value.trim();
  if (s.title !== t0 || s.artist !== a0) s.edited = true;
  save(); render(); $('infoDlg').close();
};

/* Claude conversion */
const samplePromise = (window.claude && window.claude.use) ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);

function setStatus(t, err) { $('status').textContent = t; $('status').classList.toggle('err', !!err); }

async function convert(jaLines, onProgress) {
  const sample = await samplePromise;
  if (!sample) throw { code:'unavailable' };
  const out = [];
  const size = 14;
  for (let s = 0; s < jaLines.length; s += size) {
    const chunk = jaLines.slice(s, s + size);
    onProgress(s, jaLines.length);
    const prompt =
`You help Korean learners study Japanese song lyrics.
For each Japanese line in the JSON array below, return:
- "pr": Korean Hangul pronunciation of how the line is actually sung/read. Use standard Korean transcription habits for Japanese (つ→츠, っ→받침 ㅅ or doubled consonant, long vowels written out e.g. 오오, particle は→와, へ→에, を→오). Keep spaces matching phrase breaks.
- "ko": a natural, singable-feeling Korean translation of the line (not word-by-word), consistent with the surrounding lines.
Lines may contain English or romaji; transcribe those in Hangul in "pr" too.
Return ONLY a JSON array with exactly ${chunk.length} objects in the same order: [{"pr":"...","ko":"..."}]. No other text.

Previous context (already translated, for consistency): ${JSON.stringify(jaLines.slice(Math.max(0,s-4), s))}
Lines: ${JSON.stringify(chunk)}`;
    const res = await sample.json(prompt, { modelTier:'default' });
    const arr = Array.isArray(res) ? res : (res && Array.isArray(res.lines) ? res.lines : null);
    if (!arr) throw { code:'bad_output' };
    chunk.forEach((ja, k) => out.push({ ja, pr: String(arr[k]?.pr || ''), ko: String(arr[k]?.ko || '') }));
  }
  return out;
}

const JA = /[\u3040-\u30ff\u3400-\u9fff]/;
function parseTriples(text) {
  const out = []; let cur = null, blanks = 0;
  for (const raw of text.split('\n')) {
    const l = raw.trim();
    if (!l) { blanks++; continue; }
    if (JA.test(l)) {
      if (out.length && blanks >= 2) out.push({gap:true});
      cur = {ja:l, pr:'', ko:''}; out.push(cur);
    } else if (cur) {
      if (!cur.pr) cur.pr = l; else if (!cur.ko) cur.ko = l; else cur.ko += ' ' + l;
    }
    blanks = 0;
  }
  return out;
}

$('makeBtn').onclick = async () => {
  const title = $('fTitle').value.trim(), artist = $('fArtist').value.trim();
  const text = $('fLyrics').value.replace(/\r/g,'');
  if (/[가-힣]/.test(text)) {
    const lines = parseTriples(text);
    const first = lines.find(l => !l.gap);
    if (!first) { setStatus('일본어 줄을 찾지 못했습니다. 각 묶음의 첫 줄이 일본어인지 확인해 주세요.', true); return; }
    const s = { id:'s' + Date.now(), title: title || first.ja.slice(0,16), artist, hue: Math.floor(Math.random()*360), lines };
    state.songs.unshift(s); state.cur = s.id; save();
    $('fTitle').value = $('fArtist').value = $('fLyrics').value = '';
    $('addDlg').close(); render(); $('main').scrollTop = 0;
    return;
  }
  const raw = $('fLyrics').value.replace(/\r/g,'').split('\n').map(x => x.trim());
  // collapse blank lines into single gaps
  const shape = []; raw.forEach(x => { if (x) shape.push(x); else if (shape.length && shape[shape.length-1] !== null) shape.push(null); });
  while (shape.length && shape[shape.length-1] === null) shape.pop();
  const jaLines = shape.filter(Boolean);
  if (!jaLines.length) { setStatus('일본어 가사를 한 줄 이상 붙여넣어 주세요.', true); $('fLyrics').focus(); return; }

  const btn = $('makeBtn'); btn.disabled = true;
  setStatus('Claude가 발음과 해석을 붙이는 중…');
  let converted;
  try {
    converted = await convert(jaLines, (d, n) => setStatus(`Claude가 발음과 해석을 붙이는 중… (${d}/${n}줄 완료)`));
  } catch (e) {
    const msg = {
      unavailable: '폰 앱에서는 발음·해석 자동 생성이 안 돼요. 일본어만 저장했으니 연필 버튼으로 직접 적거나, 세 줄 형식으로 붙여넣어 주세요.',
      not_granted: 'Claude 사용이 허용되지 않았습니다. 일본어만 저장했어요. 페이지를 새로 열면 다시 허용할 수 있습니다.',
      rate_limited: '요청이 많아 잠시 막혔습니다. 1분쯤 뒤에 다시 눌러 주세요.'
    }[e && e.code];
    if (e && e.code === 'rate_limited') { setStatus(msg, true); btn.disabled = false; return; }
    if (e && (e.code === 'unavailable' || e.code === 'not_granted')) {
      converted = jaLines.map(ja => ({ ja, pr:'', ko:'' }));
      setStatus(msg, true);
    } else {
      setStatus('변환 결과를 읽지 못했습니다. 다시 한 번 눌러 주세요.', true); btn.disabled = false; return;
    }
  }
  let k = 0;
  const lines = shape.map(x => x === null ? {gap:true} : converted[k++]);
  const s = { id: 's' + Date.now(), title: title || jaLines[0].slice(0, 16), artist, hue: Math.floor(Math.random()*360), lines };
  state.songs.unshift(s); state.cur = s.id; save();
  btn.disabled = false;
  $('fTitle').value = $('fArtist').value = $('fLyrics').value = '';
  if (!$('status').classList.contains('err')) $('addDlg').close();
  else setTimeout(() => $('addDlg').close(), 2600);
  render(); $('main').scrollTop = 0;
};

const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => state.prefs.theme ? state.prefs.theme === 'dark' : sysDark.matches;
function applyTheme() {
  const r = document.documentElement;
  if (state.prefs.theme) r.dataset.theme = state.prefs.theme; else delete r.dataset.theme;
  const d = isDark();
  $('themeBtn').innerHTML = d ? SUN : MOON;
  $('themeBtn').setAttribute('aria-label', d ? '라이트 모드로 전환' : '다크 모드로 전환');
  $('themeBtn').title = d ? '라이트 모드' : '다크 모드';
}
$('themeBtn').onclick = () => { state.prefs.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); };
sysDark.addEventListener?.('change', applyTheme);

/* long lines shrink to fit one line, but never below ~72% of the normal size; past that they wrap instead of being cut off */
function fitOne(p) {
  p.style.fontSize = ''; p.classList.remove('wrap');
  const cw = p.clientWidth; if (!cw) return;
  const sw = p.scrollWidth; if (sw <= cw) return;
  const base = parseFloat(getComputedStyle(p).fontSize);
  const want = Math.floor(base * cw / sw * 10) / 10, min = Math.max(13, Math.round(base * 0.72));
  if (want >= min) p.style.fontSize = want + 'px';
  else { p.style.fontSize = min + 'px'; p.classList.add('wrap'); }
}
function fitAll() {
  if (editing) return;
  document.querySelectorAll('.ln p').forEach(fitOne);
}

applyTheme(); applyPrefs(); render();
loadBundled();

/* cross-browser sync: each person's songs live in their own private space */
(async () => {
  if (!window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([claude.use('db').catch(() => null), claude.use('user').catch(() => null)]);
  if (!db || !user) return;
  const uid = await user.id(); if (!uid) return;
  const col = db.collection('data/users/' + uid);
  let first = true;
  col.onSnapshot(snap => {
    const bodies = snap.docs.map(d => d.data()).filter(Boolean);
    const songs = bodies.filter(x => x.song).map(x => x.song);
    const rp = (bodies.find(x => x.prefs) || {}).prefs;
    const prefsChanged = applyRemotePrefs(rp);
    if (first && !rp) pushPrefs();
    if (prefsChanged) { applyTheme(); applyPrefs(); }
    if (first) {
      first = false; remote = col;
      const ids = new Set(songs.map(s => s.id));
      songs.forEach(s => synced[s.id] = JSON.stringify(s));
      const localOnly = state.songs.filter(s => !ids.has(s.id));
      state.songs = [...songs, ...localOnly];
      if (localOnly.length) pushSongs();
    } else {
      synced = {};
      songs.forEach(s => synced[s.id] = JSON.stringify(s));
      state.songs = songs;
    }
    state.songs.sort((a, b) => (parseInt(b.id.slice(1)) || 0) - (parseInt(a.id.slice(1)) || 0));
    if (!state.songs.some(s => s.id === state.cur)) state.cur = state.songs[0] ? state.songs[0].id : null;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    if (!editing) render();
    if ($('libDlg').open) renderList();
  }, syncMsg);
})();
if (window.ResizeObserver) new ResizeObserver(() => fitAll()).observe($('lyrics'));
if (document.fonts) document.fonts.ready.then(fitAll);
})();
</script>

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {}));
